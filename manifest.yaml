# Registry traversal manifest (ARCH-017)
# The machine-readable entry point of the ELMM registry repository. Every walk
# of this repository, by a human or by an agent, starts at BOOTSTRAP.md and then
# reads this manifest. Files not listed here are non-normative. This is the
# unified home where the live register (discovery) and the MMDG (composition)
# converge: one entry file per model satisfies both the upstream registry entry
# shape and the MMDG node profile at once. Cites ARCH-002, ARCH-003, ARCH-009,
# ARCH-016, ARCH-017, ARCH-018, CORE-009, CORE-012, FED-013.

manifest_version: "0.2"
registry: ver.cy/registry
bootstrap: BOOTSTRAP.md

# Reading order for agents:
#   1. Parse BOOTSTRAP.md, then this manifest.
#   2. Load every schema in schema/ (JSON Schema draft 2020-12).
#   3. Validate every *.yaml in entries/ against schema/registry-node.schema.json
#      and every edge in mmdg/edges.json against schema/mmdg-edge.schema.json;
#      a validation failure means the checkout is broken, stop and report.
#   4. Run the CI gate via ci/run.py: five checks in order, schema validation of
#      entries and edges, graph integrity (referential integrity, export
#      coverage, declared_min agreement, composes acyclicity, kernel isolation,
#      unique ids), resolver determinism, zero-change registration, and facet
#      vocabulary and generated-artifact integrity (internal facet membership,
#      group-map coverage, import drift, external-row validity, index freshness).
#   5. Treat every Core and Landscape enumeration as illustrative; the normative
#      set of models is the entries/ directory. The only normative identity is
#      registry id plus Canonical Semantic Name (ARCH-003) with version per
#      ARCH-002 and Semantic Fingerprint per ARCH-009.

paths:
  - path: entries/
    kind: entries
    description: >-
      One YAML file per registered model, the unified registration record. Each
      file validates against schema/registry-node.schema.json, the superset
      profile that carries both the upstream registry entry required fields and
      the MMDG node profile fields. The normative set of registered models is
      exactly this directory.
  - path: mmdg/
    kind: mmdg
    description: >-
      The Meta-Model Dependency Graph. Holds edges.json, the sole normative
      statement of the graph. Edge types are composes, references, masters-link,
      deprecated-in-favor-of. declared_min is the sole resolver input under
      Minimal Version Selection; version_range is a publish-time V-gate
      predicate only.
  - path: schema/
    kind: schema
    description: >-
      JSON Schemas (draft 2020-12), inlined for offline validation with no
      network: registry-node.schema.json (the unified entry, superset profile),
      mmdg-edge.schema.json (the edge record), task-descriptor.schema.json,
      context-pack.schema.json, twin-snapshot.schema.json.
  - path: resolver/
    kind: resolver
    description: >-
      The reference runtime: one deterministic resolver script implementing the
      resolution algorithm (routing, edge walk, Minimal Version Selection) and
      emitting a context pack plus a Twin Composition Snapshot. Bit-reproducible:
      no wall-clock time and no randomness, all timestamps come from input,
      snapshot_id and edges_hash are derived deterministically.
  - path: ci/
    kind: ci
    description: >-
      The five conformance checks run in order by ci/run.py on every proposed
      change: schema validation of entries and edges; graph integrity
      (referential integrity with both endpoints registered, export coverage
      with every referenced kind in the target's exports, agreement between each
      edge declared_min and the from-record requires min_version, composes
      acyclicity, kernel isolation, unique ids); resolver determinism;
      zero-change registration; and facet vocabulary and generated-artifact
      integrity (internal facet membership, group-map coverage, import drift,
      external-row validity, index freshness). The write path is propose-only:
      change lands by pull request.
  - path: examples/
    kind: example
    description: >-
      One worked example: a task descriptor with the context pack it resolves to
      and the Twin Composition Snapshot that pins the resolution, walked end to
      end against the seed entries and edges.
  - path: external/
    kind: external
    description: >-
      The external standards catalogue: external-standards.csv, the discoverable
      reference standards of the unified registry (many, faceted, and not MMDG
      nodes until instantiated by a future external-to-internal transform, which
      is out of scope in v0.2). Generated deterministically by
      tools/import_external.py from external-models.source.csv plus the facet
      files: the source columns unchanged, with an Industry column inherited from
      each row's Group through facets/group-industry-map.csv. Each row projects
      to an object that validates against schema/external-standard.schema.json.
      README.md documents the catalogue and the fixed CSV-to-JSON field mapping.
  - path: facets/
    kind: facets
    description: >-
      The two orthogonal facet axes of the unified registry, as versioned
      vocabulary files. industry.yaml is the sector axis (scheme vercy-industry:
      fifteen ISIC-aligned verticals and twelve cross-cutting horizontals,
      twenty-seven codes);
      clusters.yaml is the ontological axis (the fifteen ontological clusters,
      mirroring the world-models cluster directories). group-industry-map.csv
      maps each of the thirty-seven source groups to one or more industry codes;
      compositional-roles.yaml and link-types.yaml carry the ARCH-016 role and
      link-type vocabularies. The vocabularies are closed and swappable: a
      re-map to raw ISIC, NACE or GICS is a facet change, not a schema change.
  - path: index/
    kind: index
    description: >-
      The unified discovery index, unified-index.json, generated deterministically
      by tools/build_index.py over both entry classes: the internal meta-model
      records in entries/ and the external standards in external/. It carries the
      two facet axes so a consumer can query by industry or by cluster across
      both classes without opening every file. A derived artifact, rebuildable
      byte-identically from the entries, the external catalogue and the facets.
  - path: tools/
    kind: tools
    description: >-
      The deterministic generators and the query helper: import_external.py
      (builds external/external-standards.csv from the source and the facets),
      build_index.py (builds index/unified-index.json over both entry classes),
      and query.py (reads the index to answer facet queries). Python 3, standard
      library plus PyYAML and jsonschema only, no wall-clock and no randomness,
      stable sort order everywhere so a regenerated catalogue or index is
      byte-identical. README.md documents invocation.

# kind_rules: how a traversal tool classifies and validates each normative file.
kind_rules:
  - match: "entries/*.yaml"
    kind: registry-node
    format: yaml
    schema: schema/registry-node.schema.json
    description: >-
      A unified registration record. Validates against the superset profile:
      the upstream entry required fields (id, name, publisher, owner, version,
      kind, status, license, access, purpose, registered, and source when access
      is public) and the MMDG node profile fields (csn, primary_namespace, role,
      fingerprint, source, steward, sync_contract, exports, requires,
      display_alias, with optional industry, origin, provenance, routing_hints).
  - match: "mmdg/edges.json"
    kind: mmdg-edge-file
    format: json
    item_schema: schema/mmdg-edge.schema.json
    description: >-
      A JSON array of edge records; each element validates against
      mmdg-edge.schema.json. The sole normative statement of the MMDG.
  - match: "external/external-standards.csv"
    kind: external-standards-file
    format: csv
    item_schema: schema/external-standard.schema.json
    description: >-
      The external standards catalogue as a CSV table. Each row projects to a
      JSON object under the fixed lower_snake_case CSV-to-JSON field mapping and
      validates against external-standard.schema.json. Generated by
      tools/import_external.py; ci/check_facets.py regenerates and diffs it and
      validates every projected row. Not an MMDG node file: external standards
      carry the source columns plus the two facet axes, not the node profile.
  - match: "facets/industry.yaml"
    kind: facet-vocabulary
    format: yaml
    description: >-
      The industry facet vocabulary (scheme vercy-industry): the closed set of
      industry codes the industry[] fields reference. The sector axis of the
      unified registry, orthogonal to the cluster axis.
  - match: "facets/clusters.yaml"
    kind: facet-vocabulary
    format: yaml
    description: >-
      The cluster facet vocabulary: the closed set of the fifteen ontological
      cluster ids the cluster[] fields reference, mirroring the world-models
      cluster directories. The ontological axis, orthogonal to the industry axis.
  - match: "facets/group-industry-map.csv"
    kind: facet-map
    format: csv
    description: >-
      Maps each of the thirty-seven source groups to one or more industry codes
      (semicolon-separated). The importer reads it to inherit industry onto every
      external standard from its Group.
  - match: "facets/compositional-roles.yaml"
    kind: facet-vocabulary
    format: yaml
    description: >-
      The ARCH-016 compositional-role vocabulary R1 to R8, with the default link
      type each role implies. Referenced by the external catalogue
      compositional_role and default_link_type columns.
  - match: "facets/link-types.yaml"
    kind: facet-vocabulary
    format: yaml
    description: >-
      The ARCH-016 link-type vocabulary (EMBED, REFERENCE, MIX-IN, COMPOSE,
      ALIGN, EXTEND, and the N/A sentinel). Referenced by the external catalogue
      default_link_type column.
  - match: "index/unified-index.json"
    kind: unified-index
    format: json
    description: >-
      The generated discovery index over both entry classes, carrying the two
      facet axes for query by industry or by cluster. A derived artifact,
      rebuildable byte-identically by tools/build_index.py.

traversal_rules:
  - "Entry point. BOOTSTRAP.md is the single entry point; this manifest lists what
    lives where. Files not listed are non-normative."
  - "Identity. Registry ids are publisher-prefixed (for example orkestron.aismm,
    vercy.plmm). Acronyms are display aliases only. Cross-model references carry a
    model id and a version, or a Semantic Fingerprint."
  - "Edges. The edge vocabulary is closed and kernel-owned: composes, references,
    masters-link, deprecated-in-favor-of. The node field role holds core,
    landscape, kernel; the edge field compositional_role binds to ARCH-016 roles
    R1 to R8 and is required on composes and references edges. No composes edge
    leaves the kernel node."
  - "Snapshots. A resolved composition is pinned by a Twin Composition Snapshot,
    one id, version and semantic_fingerprint per resolved model. The fingerprint
    is the semantic pin; a byte hash never is."
  - "Mastership. Never resolve mastership from an edge file. A masters-link edge is
    a pointer; the authority is the owning model's ARCH-018 sources.yaml register."
  - "Freshness. Synchronization in v0.1 is git pull. Every record declares a
    sync_contract (mode, freshness); anything read into a context pack carries an
    observed_at stamp supplied from resolver input."
