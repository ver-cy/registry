# Illustrative internal Model Registration Record: the deployment site's product.
# Example instance (like acme.fhir): shows how a deployment registers its own
# software product, modeled in AISMM, so a Landscape can compose it at instance
# grain and close AISMM to PLMM at the deployment site. Anonymized tenant
# 'deploy'; the source repository is a placeholder. This is an example of the
# instance-registration pattern, not a live model.
#
# One file, two schemas: the Meta-Universe registry entry fields plus the MMDG
# node profile fields (see vercy.aismm.yaml header for the convergence
# rationale and the change-request track). role is the MMDG-normative field;
# role core maps to kind domain.
#
# This node conforms to the reference Core model vercy.aismm at 3.1.0: it
# exports the AISMM product kinds it realizes (software-product, entity) so a
# Landscape (deploy.portfolio) can name it as a composes target. Nothing is
# declared out of vercy.aismm here; this node conforms to it and stays
# internally owned (vercy.aismm keeps requires []).

# Upstream registry entry fields (entry.schema.json)
id: deploy.aismm-product
name: Deployment Site Product
publisher: deploy
owner: deploy
kind: domain
license: Apache-2.0
access: public
purpose: >-
  Illustrative instance of the reference Core model for a single software
  product at a deployment site. It conforms to vercy.aismm and exports the
  product kinds a portfolio composes. An example of the instance-registration
  pattern, not a live model.
registered: "2026-08-10"

# MMDG node profile fields (mmdg-node.schema.json)
csn: deployment-site-product
primary_namespace: deploy.aismm-product
display_alias: DeployProduct
role: core
version: "0.1.0"
status: draft
origin: internal
tenant: deploy
fingerprint: "mufp:de91073d0c7a5b46"
source:
  repository: https://example.invalid/deploy/aismm-product
steward: deploy
sync_contract:
  mode: git
  freshness: PT24H
# Facet axes (v0.2). industry codes from facets/industry.yaml (vercy-industry),
# cluster codes from facets/clusters.yaml. A software product modeled in AISMM
# is foundation-and-semantics substrate; as a thing it is knowledge-information.
industry:
  - foundation-semantics
cluster:
  - knowledge-information
exports:
  - software-product
  - entity
requires: []
# Upstream conformance block: this instance conforms to the reference Core model
# vercy.aismm at 3.1.0 (compositional_role R2). Recorded as conformance, not
# derived_from: derived_from is the external-to-internal lineage head, and
# vercy.aismm is an internal registered Core model this product conforms to.
conformance:
  conforms_to: vercy.aismm
  version: "3.1.0"
  compositional_role: R2
  note: >-
    Illustrative example instance. This product is modeled in AISMM and conforms
    to vercy.aismm at 3.1.0; it is registered so deploy.portfolio can
    compose it (kinds software-product, entity) and close AISMM to PLMM at the
    deployment site. Nothing is ever declared out of vercy.aismm.
