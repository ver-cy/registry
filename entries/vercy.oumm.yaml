# One file, two schemas: the Meta-Universe registry entry fields plus the
# MMDG node profile fields (see orkestron.aismm.yaml header for the
# convergence rationale and the change-request track). role is the
# MMDG-normative field; role core maps to kind domain.
#
# OUMM is a Core model: the org-unit primitive that other models resolve
# to rather than re-define. It composes no other model and is composed or
# referenced by Landscape models by reference. Its exports are the kinds a
# consumer references (org-unit, reporting-line, established-position,
# unit-mandate); PLMM references org-unit from its Business Unit grain.
# The export list is illustrative per ARCH-002 and ARCH-003; the normative
# set is what this registry holds. Identity is registry id plus CSN plus
# Namespace (ARCH-003); the semantic pin is the Semantic Fingerprint
# (ARCH-009) over the canonical form, never a byte hash.

